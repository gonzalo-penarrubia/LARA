name: CI Pipeline

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --no-cache-dir
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=src --cov-fail-under=80

    - name: Start MLflow server
      run: |
        mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000 &
        sleep 10  # Aumentamos el tiempo de espera para asegurar que el servidor inicie completamente

    - name: Verificar servidor MLflow
      run: |
        python -c "
        import time
        import requests
        import sys

        for i in range(5):
            try:
                response = requests.get('http://localhost:5000/api/2.0/mlflow/experiments/list')
                if response.status_code == 200:
                    print('Servidor MLflow funcionando correctamente')
                    sys.exit(0)
            except Exception as e:
                print(f'Intento {i+1}: Error al verificar MLflow: {e}')
            time.sleep(2)

        print('ERROR: No se pudo conectar al servidor MLflow')
        sys.exit(1)
        "

    - name: Train Whisper model
      run: |
        python train_whisper.py

    - name: Listar ejecuciones de MLflow
      run: |
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://localhost:5000')
        client = mlflow.tracking.MlflowClient()

        # Listar todos los experimentos
        experiments = client.list_experiments()
        print(f'Experimentos disponibles: {[exp.name for exp in experiments]}')

        # Buscar el experimento específico
        experiment = client.get_experiment_by_name('LARA Whisper Transcription')
        if experiment:
            print(f'Experimento encontrado con ID: {experiment.experiment_id}')
            # Listar ejecuciones
            runs = client.search_runs(experiment_ids=[experiment.experiment_id], order_by=['start_time DESC'])
            print(f'Número de ejecuciones: {len(runs)}')
            if runs:
                print(f'Última ejecución: {runs[0].info.run_id}')
                print(f'Artefactos: {client.list_artifacts(runs[0].info.run_id)}')
        else:
            print('Experimento no encontrado')
        "

    - name: Evaluate Whisper model
      run: |
        python evaluate_whisper.py

    - name: Register model in production (solo en master)
      if: github.ref == 'refs/heads/master'
      run: |
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://localhost:5000')
        client = mlflow.tracking.MlflowClient()
        experiment = client.get_experiment_by_name('LARA Whisper Transcription')
        latest_runs = client.search_runs(experiment_ids=[experiment.experiment_id], order_by=['start_time DESC'], max_results=1)
        latest_run = latest_runs[0]
        model_uri = f'runs:/{latest_run.info.run_id}/lara_whisper'
        try:
            registered_model = mlflow.register_model(model_uri=model_uri, name='WhisperLara')
            print(f'Modelo registrado como WhisperLara versión {registered_model.version}')
        except Exception as e:
            print(f'Error al registrar modelo: {e}')
            # Si falla el registro, el flujo debe continuar
        "
